<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investigação de Ocorrências SSMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Sistema interno SSMA: base neutra, verde institucional em navegação/ação, cor forte só em status. Barra global + cabeçalho do registro + trilho de etapas + formulário em seções. */
:root{
  color-scheme: light;
  --brand:#07583C; --brand-hover:#05462F; --brand-tint:#EAF2EE; --brand-line:#B9D2C6;
  --ink:#1E2924; --muted:#5B6862; --faint:#8A9690;
  --line:#D6DDD9; --line-strong:#BFC8C3;
  --surface:#FFFFFF; --canvas:#F2F4F3; --subtle:#F7F8F8;
  --ok:#2F6B2A; --ok-bg:#EEF6E2; --ok-line:#B3DD64;
  --warn:#7A4B00; --warn-bg:#FFF5E3; --warn-line:#FDB952;
  --crit:#A3271B; --crit-bg:#FCEBE9; --crit-line:#DF4636;
  --info:#1F5C8A;
  --font-body:"Open Sans",Arial,sans-serif; --font-title:"Bitter",Georgia,serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:13px;line-height:1.45;color:var(--ink);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
h1,h2,h3{margin:0;text-wrap:balance}
.tab-num{font-variant-numeric:tabular-nums}
a{color:var(--brand)}

/* barra global */
.appbar{height:48px;background:var(--brand);color:#fff;display:flex;align-items:center;padding:0 16px;gap:18px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .org{font-weight:700}
.brand .sep{width:1px;height:20px;background:rgba(255,255,255,.35)}
.brand .sys{font-weight:500;opacity:.92}
.appnav{display:flex;height:100%}
.appnav a{white-space:nowrap;display:flex;align-items:center;padding:0 14px;color:rgba(255,255,255,.82);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;border-top:3px solid transparent}
.appnav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.appnav a.on{color:#fff;border-bottom-color:#B3DD64}
.appbar .sp{flex:1}
.hsel{display:flex;align-items:center;gap:6px}
.hsel label{font-size:11px;opacity:.8}
.hsel select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:var(--r);padding:0 6px;height:28px}
.hsel select option{color:var(--ink)}
.user{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.25)}
.hlink{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;font:600 12px "Open Sans",sans-serif;padding:5px 10px;border-radius:3px;cursor:pointer;text-decoration:none;margin-left:8px}.hlink:hover{background:rgba(255,255,255,.12)}
.avatar{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.user .n{font-weight:600;line-height:1.1;white-space:nowrap}.user .txt{white-space:nowrap}
@media (max-width:1560px){.brand .sys,.brand .sep{display:none}}
@media (max-width:1280px){.user .txt{display:none}}.user .p{font-size:11px;opacity:.8}

/* botões */
.btn{height:30px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--subtle);border-color:var(--faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-tint)}
.btn.danger{color:var(--crit);border-color:#E7B4AE}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--brand);font-weight:600;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.x{background:none;border:0;color:var(--faint);cursor:pointer;width:26px;height:26px;border-radius:var(--r);font-size:15px;line-height:1}
.x:hover{background:var(--crit-bg);color:var(--crit)}

/* status e etiquetas */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.st-elaboracao{color:var(--info)}.st-devolvida{color:var(--warn)}.st-aprovacao{color:#6B4FA0}.st-assinatura{color:var(--warn)}.st-concluida{color:var(--ok)}.st-late{color:var(--crit)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:2px;border:1px solid var(--line);background:var(--subtle);color:var(--muted);white-space:nowrap}
.tag.w{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.tag.e{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit)}
.tag.o{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.tag.g{background:var(--brand-tint);border-color:var(--brand-line);color:var(--brand)}
.pot{display:inline-block;min-width:64px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:2px;white-space:nowrap}
.pot.b{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.pot.m{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.pot.a{background:var(--crit-bg);color:var(--crit);border:1px solid var(--crit-line)}
.pot.n{background:var(--subtle);color:var(--faint);border:1px solid var(--line)}

/* cabeçalho de página / registro */
.pagehead{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px 0}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumbs a{text-decoration:none;font-weight:600}
.titlerow{display:flex;align-items:flex-start;gap:16px;margin-top:6px;flex-wrap:wrap}
.titlerow h1{font-family:var(--font-title);font-weight:600;font-size:20px;line-height:1.3}
.titlerow .id{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.titlerow .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.keys{display:flex;flex-wrap:wrap;margin:12px 0 0;border-top:1px solid var(--line)}
.keys div{padding:8px 20px 10px 0;margin-right:20px;min-width:100px}
.keys dt{font-size:11px;color:var(--muted)}
.keys dd{margin:2px 0 0;font-weight:600}
.pad{padding:16px 24px 32px}

/* listagem */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:2fr repeat(4,minmax(120px,1fr)) auto;gap:10px 12px;align-items:end}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px}
.fl select,.fl input,.field{height:30px;width:100%;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:0 8px}
.tablecard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .count{font-weight:600}
.toolbar .sp{flex:1}
.scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse}
table.grid th{background:var(--subtle);text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:8px 10px;border-bottom:1px solid #E8ECEA;vertical-align:middle}
table.grid.click tbody tr{cursor:pointer}
table.grid.click tbody tr:hover td{background:#F5F8F6}
table.grid .desc{max-width:340px}
table.grid .desc b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.grid .desc span{color:var(--muted);font-size:12px}
.mini{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}
.mini i{width:8px;height:4px;background:#DDE3E0;display:block}
.mini i.f{background:var(--brand)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* área de trabalho */
.workspace{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 48px)}
.steps{background:var(--surface);border-right:1px solid var(--line);padding:16px 0}
.steps h2{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:0 16px}
.prog{padding:8px 16px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.bar{height:4px;background:#E3E8E5;border-radius:2px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand)}
.steps ol{list-style:none;margin:8px 0 0;padding:0}
.steps li{position:relative}
.steps li button{width:100%;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:9px 16px;text-align:left;background:none;border:0;border-left:3px solid transparent;cursor:pointer}
.steps li button:hover{background:var(--subtle)}
.steps li.on button{background:var(--brand-tint);border-left-color:var(--brand)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:30px;top:33px;bottom:-9px;width:1px;background:var(--line)}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);position:relative;z-index:1}
.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.on .dot{border-color:var(--brand);color:var(--brand)}
.done.on .dot{color:#fff}
.steps .lbl{font-weight:600;line-height:1.25}
.steps .sub{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}
.steps .sub.w{color:var(--warn)}.steps .sub.e{color:var(--crit)}
.steps .grp{margin-top:14px;padding:10px 16px 0;border-top:1px solid var(--line)}
.steps .grp button{display:block;padding:5px 0;color:var(--brand);font-weight:600;font-size:12px;background:none;border:0;cursor:pointer}
.steps .grp button.on{text-decoration:underline}
.main{min-width:0;display:flex;flex-direction:column}
.content{padding:16px 24px 24px;max-width:1240px;width:100%}
.strip{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--warn-line);border-left-width:4px;background:var(--warn-bg);border-radius:var(--r);margin-bottom:14px}
.strip b{color:var(--warn)}
.strip.e{border-color:var(--crit-line);background:var(--crit-bg)}.strip.e b{color:var(--crit)}
.strip.i{border-color:var(--brand-line);background:var(--brand-tint)}.strip.i b{color:var(--brand)}
.strip.o{border-color:var(--ok-line);background:var(--ok-bg)}.strip.o b{color:var(--ok)}
.strip ul{margin:4px 0 0;padding-left:18px}
.strip .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.section > header{display:flex;align-items:baseline;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.section > header h3{font-size:14px;font-weight:700}
.section > header .hint{font-size:12px;color:var(--muted)}
.section > header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.section .body{padding:14px 16px 16px}
.section .body.flush{padding:0}
.form{display:grid;grid-template-columns:repeat(12,1fr);gap:12px 16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.f label.l,.lbl2{display:block;font-size:12px;font-weight:600;color:#3D4943;margin-bottom:4px}
.req{color:var(--crit);margin-left:2px}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f input[type=url],.f select,.f textarea,.inp{width:100%;height:32px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 9px;background:var(--surface)}
.f textarea,textarea.inp{height:auto;min-height:56px;padding:7px 9px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(7,88,60,.15)}
input:disabled,select:disabled,textarea:disabled{background:var(--subtle);color:var(--ink);opacity:1;cursor:default}
.f .ro,.ro{min-height:32px;display:flex;align-items:center;padding:4px 9px;background:var(--subtle);border:1px solid var(--line);border-radius:var(--r);font-weight:600;gap:8px}
.f .help{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.w{font-size:11px;margin-top:4px;line-height:1.4}
.w .a{color:var(--warn);display:block}
.w .e{color:var(--crit);display:block}
.radio{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;height:32px}
.radio button{display:flex;align-items:center;padding:0 14px;cursor:pointer;border:0;border-right:1px solid var(--line-strong);font-weight:600;background:var(--surface)}
.radio button:last-child{border-right:0}
.radio button.on{background:var(--brand-tint);box-shadow:inset 0 -2px 0 var(--brand);color:var(--brand)}
.radio button:disabled{cursor:default}
.checks{display:flex;gap:16px;min-height:32px;align-items:center;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.muted{color:var(--muted)}.small{font-size:12px}

/* tabelas de edição */
table.edit{width:100%;border-collapse:collapse}
table.edit th{background:var(--subtle);text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.edit td{padding:6px 8px;border-bottom:1px solid #E8ECEA;vertical-align:top}
table.edit td.num{font-weight:700;color:var(--brand);width:46px;padding-top:12px}
table.edit .inp{height:30px}
.addrow{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap}

/* matriz */
.mx-wrap{display:grid;grid-template-columns:auto minmax(260px,1fr);gap:20px;align-items:start}
table.mx{border-collapse:separate;border-spacing:2px}
table.mx th{font-size:11px;font-weight:600;color:var(--muted);background:var(--subtle);border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
table.mx th.col{text-align:center;width:70px}
table.mx th.axis{background:none;border:0;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.3px;font-size:10px}
table.mx td{width:70px;height:32px;text-align:center;font-weight:700;font-size:12px;cursor:pointer;border:1px solid transparent}
table.mx td.b{background:var(--ok-bg);color:var(--ok);border-color:#D9EBC0}
table.mx td.m{background:var(--warn-bg);color:var(--warn);border-color:#F6DDB0}
table.mx td.a{background:var(--crit-bg);color:var(--crit);border-color:#F2C7C2}
table.mx td:hover{border-color:var(--ink)}
table.mx td.sel{outline:2px solid var(--ink);outline-offset:-1px}
table.mx td.sel.b{background:var(--ok-line);color:#1E3F0F}
table.mx td.sel.m{background:var(--warn-line);color:#3D2600}
table.mx td.sel.a{background:var(--crit-line);color:#fff}
.ro-mode table.mx td,.ro-mode table.ref td{cursor:default}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:1px}
.result{border:1px solid var(--line);border-radius:var(--r)}
.result .hd{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--subtle)}
.result .score{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.result dl{margin:0;padding:10px 12px;display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:12px}
.result dt{color:var(--muted)}.result dd{margin:0}
.result .acc{padding:0 12px 12px;font-size:12px;color:var(--muted)}
details.crit{margin-top:12px;border:1px solid var(--line);border-radius:var(--r)}
details.crit summary{padding:8px 12px;cursor:pointer;font-weight:600;color:var(--brand);list-style:none}
details.crit summary::-webkit-details-marker{display:none}
details.crit summary::before{content:"▸ ";color:var(--muted)}
details.crit[open] summary::before{content:"▾ "}
table.ref{width:100%;border-collapse:collapse;font-size:12px}
table.ref th{background:var(--subtle);font-weight:700;color:var(--muted);text-align:left;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px}
table.ref td{padding:6px 8px;border-bottom:1px solid #EBEFED;vertical-align:top;cursor:pointer}
table.ref td:first-child{font-weight:600;color:var(--muted);cursor:default;white-space:nowrap}
table.ref td.sel{background:var(--brand-tint);box-shadow:inset 3px 0 0 var(--brand);font-weight:600}

/* casos semelhantes */
.sim{border-top:1px solid #E8ECEA;padding:10px 16px;display:grid;grid-template-columns:120px 1fr;gap:4px 14px}
.sim:first-child{border-top:0}
.sim .meta{font-size:12px;color:var(--muted)}
.sim .meta b{color:var(--ink);display:block}
.sim .txt{font-size:12px}
.sim .txt .ac{color:var(--muted);margin-top:3px}

/* árvore */
.tree-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}.tree-wrap>div{min-width:0}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:620px;min-height:340px}
.canvas svg{display:block}
.node{cursor:pointer}
.panel{position:sticky;top:60px}

/* ações */
.acao{border-bottom:1px solid #E8ECEA;padding:12px 16px}
.acao:last-child{border-bottom:0}
.acao.pad{box-shadow:inset 3px 0 0 var(--ok-line)}
.acao .top{display:grid;grid-template-columns:44px 1fr 28px;gap:8px;align-items:start}
.acao .n{font-weight:700;color:var(--brand);padding-top:7px}
.acao .grid4{display:grid;grid-template-columns:1.5fr 1.2fr .8fr 1fr;gap:10px;margin:8px 0 0 52px}
.acao .causes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 52px;align-items:center}
.acao .causes label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);padding:2px 8px;border-radius:2px;cursor:pointer;font-size:12px}
.acao .ef{margin:10px 0 0 52px;padding:10px 12px;border:1px solid var(--line);background:var(--subtle);border-radius:var(--r);display:grid;grid-template-columns:1fr 1fr 180px;gap:10px}

/* rodapé de ações */
.footbar{position:sticky;bottom:0;margin-top:auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:8px;z-index:5}
.footbar .where{color:var(--muted);font-size:12px}
.footbar .sp{flex:1}

/* histórico */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:10px 16px;border-bottom:1px solid #E8ECEA}
.timeline li:last-child{border-bottom:0}
.timeline .when{color:var(--muted);font-size:12px}

/* modal e toast */
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box.wide{max-width:980px}
.mh{font:600 13px/1.3 'Open Sans',sans-serif;color:var(--brand);margin:0 0 4px}
.modal .box{background:var(--surface);border-radius:4px;max-width:640px;width:100%;max-height:85vh;overflow:auto;border:1px solid var(--line)}
.modal .box > header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.modal .box > .body{padding:14px 16px}
.modal .box > footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:64px;right:20px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r);z-index:70;max-width:380px;font-size:13px}
.toast.err{background:var(--crit)}
.ia .ob{border-left:3px solid var(--warn-line);padding:6px 10px;margin:8px 0;background:var(--subtle)}
.ia .ob.alta{border-left-color:var(--crit-line)}.ia .ob.baixa{border-left-color:var(--ok-line)}
body.noia .ia-only{display:none}
.proto{font-size:10px;font-weight:700;letter-spacing:.4px;background:#B3DD64;color:var(--brand);padding:2px 6px;border-radius:2px}

@media (max-width:1100px){.filters{grid-template-columns:1fr 1fr 1fr}.mx-wrap,.tree-wrap{grid-template-columns:1fr}.panel{position:static}.acao .grid4{grid-template-columns:1fr 1fr}.acao .ef{grid-template-columns:1fr}}
@media (max-width:860px){.workspace{grid-template-columns:1fr}.steps{border-right:0;border-bottom:1px solid var(--line)}.steps li:not(:last-child)::after{display:none}.form > *{grid-column:span 12 !important}.appnav,.user .txt,.hsel label,.brand .sys,.brand .sep{display:none}.acao .grid4,.acao .causes,.acao .ef{margin-left:0}}
@media (max-width:480px){.filters{grid-template-columns:1fr}.pagehead,.pad,.content{padding-left:16px;padding-right:16px}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
